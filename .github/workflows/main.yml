name: Build Mesa Android ARM64 Vulkan Wrapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK: ${{ github.workspace }}/android-ndk-r27d
      NDK_URL: https://dl.google.com/android/repository/android-ndk-r27d-linux.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            python3-mako \
            wget \
            unzip \
            gzip \
            binutils \
            bison \
            flex

      - name: Download Android NDK
        run: |
          set -e

          rm -rf "$NDK" "$NDK.tmp" ndk.zip

          wget -q --show-progress \
            "$NDK_URL" \
            -O ndk.zip

          mkdir -p "$NDK.tmp"

          unzip -q ndk.zip -d "$NDK.tmp"

          mv "$NDK.tmp/android-ndk-r27d" "$NDK"

          rm -rf "$NDK.tmp" ndk.zip

      - name: Enable Vulkan wrapper
        run: |
          set -e

          if ! grep -q '^with_wrapper_vk = true' src/vulkan/meson.build; then
            sed -i '1i with_wrapper_vk = true' src/vulkan/meson.build
          fi



      - name: Download ARM64 target dependencies
        run: |
          set -e

          rm -rf "$ROOT"
          mkdir -p "$ROOT/usr"

          BASE="https://packages-cf.termux.dev:443/apt/termux-main"

          wget -q \
            "$BASE/dists/stable/main/binary-aarch64/Packages.gz" \
            -O /tmp/Packages.gz

          gzip -dc /tmp/Packages.gz > /tmp/Packages

          download_pkg() {
            PKG="$1"

            FILE=$(awk -v pkg="$PKG" '
              /^Package:/ {
                found = ($2 == pkg)
              }
              found && /^Filename:/ {
                print $2
                exit
              }
            ' /tmp/Packages)

            if [ -z "$FILE" ]; then
              echo "Package not found: $PKG"
              exit 1
            fi

            DEB="/tmp/$(basename "$FILE")"

            echo "Downloading $PKG"

            wget -q --show-progress \
              "$BASE/$FILE" \
              -O "$DEB"

            rm -rf /tmp/pkg
            mkdir -p /tmp/pkg

            cd /tmp/pkg

            ar x "$DEB"

            DATA=$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)

            if [ -z "$DATA" ]; then
              echo "Invalid package archive: $PKG"
              exit 1
            fi

            rm -rf extract
            mkdir -p extract

            tar -xf "$DATA" -C extract

            if [ -d extract/data/data/com.termux/files/usr ]; then
              cp -a \
                extract/data/data/com.termux/files/usr/. \
                "$ROOT/usr/"
            elif [ -d extract/usr ]; then
              cp -a \
                extract/usr/. \
                "$ROOT/usr/"
            else
              echo "Unknown package layout: $PKG"
              exit 1
            fi

            cd "$GITHUB_WORKSPACE"
          }

          download_pkg libandroid-support
          download_pkg libdrm
          
          for d in \
            "$ROOT/usr/lib/pkgconfig" \
            "$ROOT/usr/share/pkgconfig"
          do
            if [ -d "$d" ]; then
              find "$d" \
                -type f \
                -name '*.pc' \
                -exec sed -i \
                "s#/data/data/com.termux/files/usr#$ROOT/usr#g" \
                {} +
            fi
          done


      - name: Create Android ARM64 cross file
        run: |
          set -e

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p build

          cat > build/android-arm64.ini <<EOF
          [binaries]
          ar = '$TOOLCHAIN/bin/llvm-ar'
          c = '$TOOLCHAIN/bin/aarch64-linux-android34-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android34-clang++'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          c_ld = 'lld'
          cpp_ld = 'lld'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [built-in options]
          c_args = ['--sysroot=$TOOLCHAIN/sysroot']
          cpp_args = ['--sysroot=$TOOLCHAIN/sysroot']
          c_link_args = ['--sysroot=$TOOLCHAIN/sysroot']
          cpp_link_args = ['--sysroot=$TOOLCHAIN/sysroot']
          EOF

      - name: Configure Mesa
        run: |
          set -e

          rm -rf build/mesa

          meson setup build/mesa . \
            --cross-file build/android-arm64.ini \
            --prefix=/system \
            --libdir=lib64 \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=android \
            -Dplatform-sdk-version=34 \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Dglx=disabled \
            -Degl=disabled \
            -Dgbm=disabled \
            -Dgallium-drivers= \
            -Dvulkan-drivers=wrapper

      - name: Build Mesa
        run: |
          set -e

          ninja -C build/mesa -j$(nproc)

      - name: Package
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          find build/mesa \
            -type f \
            \( -name '*.so' -o -name '*.so.*' \) \
            -exec cp -a {} artifact/ \;

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64
          path: artifact/
