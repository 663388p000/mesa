name: Build Mesa Vulkan Wrapper - Android ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: r27d
      ANDROID_API: "34"
      NDK_DIR: ${{ github.workspace }}/android-ndk
      TERMUX_ROOT: ${{ github.workspace }}/termux-root
      TERMUX_CACHE: ${{ github.workspace }}/termux-cache

    steps:
      - name: Checkout Mesa
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-mako \
            bison \
            flex \
            gettext \
            cmake \
            curl \
            wget \
            xz-utils \
            zstd \
            unzip \
            binutils \
            ca-certificates

      # ------------------------------------------------------------
      # Android NDK
      # ------------------------------------------------------------

      - name: Download Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

          rm -rf \
            "$NDK_DIR" \
            "$NDK_DIR.tmp" \
            ndk.zip

          echo "Downloading NDK:"
          echo "$NDK_URL"

          wget -q --show-progress \
            "$NDK_URL" \
            -O ndk.zip

          mkdir -p "$NDK_DIR.tmp"

          unzip -q ndk.zip \
            -d "$NDK_DIR.tmp"

          NDK_EXTRACTED="$NDK_DIR.tmp/android-ndk-${NDK_VERSION}"

          if [ ! -d "$NDK_EXTRACTED" ]; then
            echo "ERROR: NDK directory was not found"
            find "$NDK_DIR.tmp" -maxdepth 2 -type d -print
            exit 1
          fi

          mv "$NDK_EXTRACTED" "$NDK_DIR"

          rm -rf \
            "$NDK_DIR.tmp" \
            ndk.zip

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$TOOLCHAIN/bin"

          echo "NDK: $NDK_DIR"
          echo "Toolchain: $TOOLCHAIN"

          test -d "$TOOLCHAIN"
          test -x "$BIN/aarch64-linux-android34-clang"
          test -x "$BIN/aarch64-linux-android34-clang++"
          test -x "$BIN/llvm-ar"
          test -x "$BIN/llvm-ranlib"
          test -x "$BIN/llvm-strip"
          test -x "$BIN/llvm-readelf"
          test -x "$BIN/ld.lld"

          echo "=== Clang ==="
          "$BIN/aarch64-linux-android34-clang" --version

      # ------------------------------------------------------------
      # Termux ARM64/Bionic X11 dependencies
      # ------------------------------------------------------------

      - name: Download ARM64/Bionic X11 dependencies
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"
          CACHE="$TERMUX_CACHE"

          MAIN_REPO="https://packages-cf.termux.dev/apt/termux-main"
          X11_REPO="https://packages-cf.termux.dev/apt/termux-x11"

          rm -rf "$ROOT" "$CACHE"

          mkdir -p \
            "$ROOT" \
            "$CACHE/index" \
            "$CACHE/deb"

          # IMPORTANT:
          # xorgproto is intentionally NOT included.
          #
          # The required X11/XCB protocol development files are provided
          # through the Termux X11 packages used below.
          PACKAGES="
          libx11
          libxext
          libxfixes
          libxrandr
          libxrender
          libxcb
          libxshmfence
          libxau
          libxdmcp
          libandroid-support
          "

          download_index() {
            local repo="$1"
            local suite="$2"
            local output="$3"

            local url
            local suffix

            for suffix in Packages.xz Packages.gz Packages; do
              url="$repo/dists/$suite/main/binary-aarch64/$suffix"

              echo "Trying:"
              echo "$url"

              if curl -fsSL \
                --retry 5 \
                --retry-delay 2 \
                "$url" \
                -o "$output"; then

                case "$suffix" in
                  Packages.xz)
                    xz -dc "$output" > "${output}.txt"
                    ;;
                  Packages.gz)
                    gzip -dc "$output" > "${output}.txt"
                    ;;
                  Packages)
                    cp "$output" "${output}.txt"
                    ;;
                esac

                echo "Downloaded package index:"
                echo "$url"

                return 0
              fi
            done

            echo "ERROR: unable to download package index"
            echo "Repository: $repo"
            echo "Suite: $suite"
            exit 1
          }

          download_index \
            "$MAIN_REPO" \
            "stable" \
            "$CACHE/index/main"

          download_index \
            "$X11_REPO" \
            "x11" \
            "$CACHE/index/x11"

          MAIN_INDEX="$CACHE/index/main.txt"
          X11_INDEX="$CACHE/index/x11.txt"

          find_package() {
            local pkg="$1"
            local index="$2"

            awk -v pkg="$pkg" '
              BEGIN {
                RS=""
                FS="\n"
              }

              {
                name=""
                filename=""
                architecture=""

                for (i = 1; i <= NF; i++) {
                  if ($i ~ /^Package: /)
                    name=substr($i, 10)

                  else if ($i ~ /^Filename: /)
                    filename=substr($i, 11)

                  else if ($i ~ /^Architecture: /)
                    architecture=substr($i, 15)
                }

                if (
                  name == pkg &&
                  architecture == "aarch64" &&
                  filename != ""
                ) {
                  print filename
                  exit
                }
              }
            ' "$index"
          }

          download_package() {
            local pkg="$1"
            local filename=""
            local repo=""

            # Search main repository first.
            filename="$(find_package "$pkg" "$MAIN_INDEX" || true)"

            if [ -n "$filename" ]; then
              repo="$MAIN_REPO"
            else
              # Then search X11 repository.
              filename="$(find_package "$pkg" "$X11_INDEX" || true)"

              if [ -n "$filename" ]; then
                repo="$X11_REPO"
              fi
            fi

            if [ -z "$filename" ]; then
              echo
              echo "ERROR: package not found: $pkg"
              echo
              exit 1
            fi

            local url="${repo%/}/$filename"
            local output="$CACHE/deb/$(basename "$filename")"

            echo
            echo "=========================================="
            echo "Package     : $pkg"
            echo "Architecture: aarch64"
            echo "Repository  : $repo"
            echo "Filename    : $filename"
            echo "URL         : $url"
            echo "=========================================="

            curl -fL \
              --retry 5 \
              --retry-delay 2 \
              "$url" \
              -o "$output"
          }

          for pkg in $PACKAGES; do
            download_package "$pkg"
          done

          echo
          echo "=== Downloaded packages ==="
          ls -lh "$CACHE/deb"

      # ------------------------------------------------------------
      # Extract ARM64 Termux packages
      # ------------------------------------------------------------

      - name: Extract Termux packages
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"
          CACHE="$TERMUX_CACHE"

          mkdir -p "$ROOT"

          for deb in "$CACHE"/deb/*.deb; do
            echo
            echo "=========================================="
            echo "Extracting: $(basename "$deb")"
            echo "=========================================="

            tmp="$ROOT/.tmp"

            rm -rf "$tmp"
            mkdir -p "$tmp"

            ar x "$deb" \
              --output "$tmp"

            data_archive=""

            if [ -f "$tmp/data.tar.xz" ]; then
              data_archive="$tmp/data.tar.xz"
            elif [ -f "$tmp/data.tar.zst" ]; then
              data_archive="$tmp/data.tar.zst"
            elif [ -f "$tmp/data.tar.gz" ]; then
              data_archive="$tmp/data.tar.gz"
            fi

            if [ -z "$data_archive" ]; then
              echo "ERROR: data archive not found:"
              ls -la "$tmp"
              exit 1
            fi

            tar -xf "$data_archive" \
              -C "$ROOT"

            rm -rf "$tmp"
          done

          rm -rf "$ROOT/.tmp"

          echo
          echo "=== Termux ARM64 libraries ==="

          find "$ROOT/usr/lib" \
            -maxdepth 1 \
            -type f \
            \( -name '*.so' -o -name '*.a' \) \
            | sort \
            | head -100

          echo
          echo "=== Termux headers ==="

          find "$ROOT/usr/include" \
            -maxdepth 2 \
            -type f \
            | sort \
            | head -100

      # ------------------------------------------------------------
      # Target pkg-config
      # ------------------------------------------------------------

      - name: Configure target pkg-config
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"

          PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"

          echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR" \
            >> "$GITHUB_ENV"

          echo "PKG_CONFIG_SYSROOT_DIR=$ROOT" \
            >> "$GITHUB_ENV"

          echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1" \
            >> "$GITHUB_ENV"

          echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1" \
            >> "$GITHUB_ENV"

          echo
          echo "=== X11/XCB pkg-config files ==="

          find "$ROOT/usr" \
            -type f \
            -name '*.pc' \
            | sort \
            | grep -E \
              '/(xcb|x11|xshmfence|xau|xdmcp)' \
            || true

      - name: Verify X11 ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"

          export PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$ROOT"

          REQUIRED="
          xcb
          x11
          x11-xcb
          xcb-dri3
          xcb-present
          xcb-xfixes
          xcb-sync
          xcb-randr
          xcb-shm
          xshmfence
          "

          echo "=== pkg-config verification ==="

          for pc in $REQUIRED; do
            echo
            echo ">>> $pc"

            if ! pkg-config --exists "$pc"; then
              echo "ERROR: missing pkg-config module: $pc"
              exit 1
            fi

            echo "Version:"
            pkg-config --modversion "$pc"

            echo "CFLAGS:"
            pkg-config --cflags "$pc"

            echo "LIBS:"
            pkg-config --libs "$pc"
          done

      # ------------------------------------------------------------
      # Force wrapper
      # ------------------------------------------------------------

      - name: Force enable Vulkan wrapper
        shell: bash
        run: |
          set -euo pipefail

          FILE="src/vulkan/meson.build"

          if ! grep -qE '^[[:space:]]*with_wrapper_vk[[:space:]]*=[[:space:]]*true' "$FILE"; then
            sed -i '1i with_wrapper_vk = true' "$FILE"
          fi

          echo "=== wrapper setting ==="
          grep -n "with_wrapper_vk" "$FILE"

      # ------------------------------------------------------------
      # Meson cross file
      # ------------------------------------------------------------

      - name: Create Meson cross file
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"

          cat > build/android-arm64.ini <<EOF
          [constants]
          ndk = '${NDK_DIR}'
          toolchain = '${TOOLCHAIN}'
          sysroot = '${SYSROOT}'
          termux = '${TERMUX_ROOT}'

          [binaries]
          c = toolchain / 'bin/aarch64-linux-android34-clang'
          cpp = toolchain / 'bin/aarch64-linux-android34-clang++'
          ar = toolchain / 'bin/llvm-ar'
          ranlib = toolchain / 'bin/llvm-ranlib'
          strip = toolchain / 'bin/llvm-strip'
          ld = toolchain / 'bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          sys_root = sysroot
          pkg_config_libdir = [
            termux / 'usr/lib/pkgconfig',
            termux / 'usr/share/pkgconfig'
          ]

          [built-in options]
          c_args = [
            '--sysroot=' + sysroot,
            '-I' + termux / 'usr/include'
          ]

          cpp_args = [
            '--sysroot=' + sysroot,
            '-I' + termux / 'usr/include'
          ]

          c_link_args = [
            '--sysroot=' + sysroot,
            '-L' + termux / 'usr/lib'
          ]

          cpp_link_args = [
            '--sysroot=' + sysroot,
            '-L' + termux / 'usr/lib'
          ]
          EOF

          echo
          echo "=== Meson cross file ==="
          cat build/android-arm64.ini

      # ------------------------------------------------------------
      # Configure Mesa
      # ------------------------------------------------------------

      - name: Configure Mesa
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"

          export PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$ROOT"
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1

          rm -rf build/mesa

          meson setup build/mesa . \
            --cross-file build/android-arm64.ini \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dvulkan-drivers= \
            -Dgallium-drivers=

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build Mesa
        shell: bash
        run: |
          set -euo pipefail

          meson compile \
            -C build/mesa \
            -j2

      # ------------------------------------------------------------
      # Find wrapper
      # ------------------------------------------------------------

      - name: Find Vulkan wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo "=== Searching for wrapper ==="

          find build/mesa \
            -type f \
            \( \
              -name 'libvulkan_wrapper.so' \
              -o -name '*vulkan*wrapper*.so' \
            \) \
            -print

      # ------------------------------------------------------------
      # Package
      # ------------------------------------------------------------

      - name: Package wrapper
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact/lib

          WRAPPER="$(
            find build/mesa \
              -type f \
              -name 'libvulkan_wrapper.so' \
              | head -n1
          )"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: libvulkan_wrapper.so not found"
            exit 1
          fi

          echo "Wrapper:"
          echo "$WRAPPER"

          cp \
            "$WRAPPER" \
            artifact/lib/libvulkan_wrapper.so

          echo
          echo "=== file ==="
          file artifact/lib/libvulkan_wrapper.so

          echo
          echo "=== ELF header ==="
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h \
            artifact/lib/libvulkan_wrapper.so

          echo
          echo "=== ELF machine ==="
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h \
            artifact/lib/libvulkan_wrapper.so \
            | grep -E 'Class:|Machine:|Type:'

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifact/
