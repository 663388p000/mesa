name: Mesa Vulkan Wrapper ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK: ${{ github.workspace }}/android-ndk
      ROOT: ${{ github.workspace }}/termux-root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3 python3-mako bison flex gettext cmake curl wget xz-utils zstd unzip binutils

      - name: Download NDK
        run: |
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -O ndk.zip
          rm -rf "$NDK" "$NDK.tmp"
          mkdir "$NDK.tmp"
          unzip -q ndk.zip -d "$NDK.tmp"
          mv "$NDK.tmp/android-ndk-r27d" "$NDK"
          rm -rf "$NDK.tmp" ndk.zip

      - name: Download X11 libraries
        run: |
          set -e
          ROOT="$ROOT/usr"
          mkdir -p "$ROOT"

          download() {
            curl -fL --retry 5 -A "Mozilla/5.0" "$1" -o /tmp/pkg.deb
            mkdir -p /tmp/deb
            ar x /tmp/pkg.deb --output /tmp/deb
            tar -xf /tmp/deb/data.tar.* -C "$ROOT"
            rm -rf /tmp/deb /tmp/pkg.deb
          }

          download https://packages-cf.termux.dev/apt/termux-main/pool/main/liba/libandroid-support/libandroid-support_29-1_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxau/libxau_1.0.12_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxdmcp/libxdmcp_1.1.5_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxcb/libxcb_1.17.0-1_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libx11/libx11_1.8.13-1_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxext/libxext_1.3.7_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxfixes/libxfixes_6.0.2_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxrandr/libxrandr_1.5.5_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxrender/libxrender_0.9.12-1_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/libx/libxshmfence/libxshmfence_1.3.3-1_aarch64.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/x/xorgproto/xorgproto_2025.1_all.deb
          download https://packages-cf.termux.dev/apt/termux-main/pool/main/x/xcb-proto/xcb-proto_1.17.0_all.deb

      - name: Enable wrapper
        run: |
          grep -q "with_wrapper_vk = true" src/vulkan/meson.build || \
            sed -i '1i with_wrapper_vk = true' src/vulkan/meson.build

      - name: Create cross file
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          mkdir -p build

          cat > build/android-arm64.ini <<EOF
          [binaries]
          c = '$TOOLCHAIN/bin/aarch64-linux-android34-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android34-clang++'
          ar = '$TOOLCHAIN/bin/llvm-ar'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'
 
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
  
          [properties]
          sys_root = '$TOOLCHAIN/sysroot'
          pkg_config_libdir = [
          '$ROOT/usr/lib/pkgconfig',
          '$ROOT/usr/share/pkgconfig'
            ]

          [built-in options]
          c_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']
          cpp_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']
          c_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']
          cpp_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']
          EOF

      - name: Build Mesa
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/termux-root/usr/lib/pkgconfig:${{ github.workspace }}/termux-root/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/termux-root
        run: |
          meson setup build/mesa . \
            --cross-file build/android-arm64.ini \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dvulkan-drivers= \
            -Dgallium-drivers=

          meson compile -C build/mesa -j2

      - name: Package
        run: |
          set -e
          mkdir -p artifact/lib

          cp "$(find build/mesa -type f -name libvulkan_wrapper.so | head -n1)" \
            artifact/lib/libvulkan_wrapper.so

          file artifact/lib/libvulkan_wrapper.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifact
