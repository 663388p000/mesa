name: Build Mesa Vulkan Wrapper - Android ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: r27d
      ANDROID_API: "34"
      NDK_DIR: ${{ github.workspace }}/android-ndk
      TERMUX_ROOT: ${{ github.workspace }}/termux-root
      TERMUX_CACHE: ${{ github.workspace }}/termux-cache

    steps:
      # ------------------------------------------------------------
      # Checkout
      # ------------------------------------------------------------

      - name: Checkout Mesa
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # ------------------------------------------------------------
      # Host dependencies
      # ------------------------------------------------------------

      - name: Install host dependencies
        shell: bash
        run: |
          set -euo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-mako \
            bison \
            flex \
            gettext \
            cmake \
            curl \
            wget \
            xz-utils \
            zstd \
            unzip \
            binutils \
            ca-certificates

      # ------------------------------------------------------------
      # Android NDK
      # ------------------------------------------------------------

      - name: Download Android NDK
        shell: bash
        run: |
          set -euo pipefail

          NDK_URL="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"

          rm -rf \
            "$NDK_DIR" \
            "$NDK_DIR.tmp" \
            ndk.zip

          echo "Downloading:"
          echo "$NDK_URL"

          wget \
            --no-verbose \
            --show-progress \
            "$NDK_URL" \
            -O ndk.zip

          mkdir -p "$NDK_DIR.tmp"

          unzip -q \
            ndk.zip \
            -d "$NDK_DIR.tmp"

          NDK_EXTRACTED="$NDK_DIR.tmp/android-ndk-${NDK_VERSION}"

          if [ ! -d "$NDK_EXTRACTED" ]; then
            echo "ERROR: extracted NDK directory not found"
            find "$NDK_DIR.tmp" -maxdepth 2 -type d -print
            exit 1
          fi

          mv \
            "$NDK_EXTRACTED" \
            "$NDK_DIR"

          rm -rf \
            "$NDK_DIR.tmp" \
            ndk.zip

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          BIN="$TOOLCHAIN/bin"

          echo
          echo "NDK:"
          echo "$NDK_DIR"

          echo
          echo "Toolchain:"
          echo "$TOOLCHAIN"

          test -d "$TOOLCHAIN"

          test -x "$BIN/aarch64-linux-android34-clang"
          test -x "$BIN/aarch64-linux-android34-clang++"
          test -x "$BIN/llvm-ar"
          test -x "$BIN/llvm-ranlib"
          test -x "$BIN/llvm-strip"
          test -x "$BIN/llvm-readelf"
          test -x "$BIN/ld.lld"

          echo
          echo "=== Android clang ==="

          "$BIN/aarch64-linux-android34-clang" \
            --version

      # ------------------------------------------------------------
      # Download Termux ARM64/Bionic X11 packages
      # ------------------------------------------------------------

      - name: Download ARM64/Bionic X11 dependencies
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"
          CACHE="$TERMUX_CACHE"

          MAIN_REPO="https://packages-cf.termux.dev/apt/termux-main"
          X11_REPO="https://packages-cf.termux.dev/apt/termux-x11"

          rm -rf \
            "$ROOT" \
            "$CACHE"

          mkdir -p \
            "$ROOT" \
            "$CACHE/index" \
            "$CACHE/deb"

          # These packages provide the X11/XCB development headers,
          # pkg-config files and ARM64/Bionic libraries required by
          # Mesa's X11 Vulkan WSI.
          #
          # xorgproto and xcb-proto are Architecture: all.

          PACKAGES="
          libandroid-support
          libxau
          libxdmcp
          libxcb
          libx11
          libxext
          libxfixes
          libxrandr
          libxrender
          libxshmfence
          xorgproto
          xcb-proto
          "

          # ----------------------------------------------------------
          # Download repository index
          # ----------------------------------------------------------

          download_index() {
            local repo="$1"
            local suite="$2"
            local output="$3"

            local url
            local suffix

            rm -f \
              "$output" \
              "${output}.txt"

            for suffix in Packages.xz Packages.gz Packages; do
              url="${repo%/}/dists/${suite}/main/binary-aarch64/${suffix}"

              echo
              echo "Trying:"
              echo "$url"

              if curl \
                --fail \
                --location \
                --silent \
                --show-error \
                --retry 5 \
                --retry-delay 2 \
                "$url" \
                -o "$output"; then

                case "$suffix" in
                  Packages.xz)
                    xz -dc \
                      "$output" \
                      > "${output}.txt"
                    ;;

                  Packages.gz)
                    gzip -dc \
                      "$output" \
                      > "${output}.txt"
                    ;;

                  Packages)
                    cp \
                      "$output" \
                      "${output}.txt"
                    ;;
                esac

                echo
                echo "Downloaded package index:"
                echo "$url"

                return 0
              fi
            done

            echo
            echo "ERROR: could not download package index"
            echo "Repository: $repo"
            echo "Suite: $suite"

            exit 1
          }

          download_index \
            "$MAIN_REPO" \
            "stable" \
            "$CACHE/index/main"

          download_index \
            "$X11_REPO" \
            "x11" \
            "$CACHE/index/x11"

          MAIN_INDEX="$CACHE/index/main.txt"
          X11_INDEX="$CACHE/index/x11.txt"

          test -s "$MAIN_INDEX"
          test -s "$X11_INDEX"

          # ----------------------------------------------------------
          # Package lookup
          #
          # Python is used instead of awk because Debian/Termux
          # Packages files contain multiline records and we also
          # need to accept Architecture: all.
          # ----------------------------------------------------------

          find_package() {
            local package="$1"
            local index="$2"

            python3 - "$package" "$index" <<'PY'
import sys

package = sys.argv[1]
index = sys.argv[2]

with open(index, "r", encoding="utf-8", errors="replace") as f:
    data = f.read()

for stanza in data.split("\n\n"):
    fields = {}

    for line in stanza.splitlines():
        if ": " in line:
            key, value = line.split(": ", 1)
            fields[key] = value.strip()

    if fields.get("Package") != package:
        continue

    architecture = fields.get("Architecture", "")
    filename = fields.get("Filename", "")

    if architecture in ("aarch64", "all") and filename:
        print(filename)
        sys.exit(0)

sys.exit(1)
PY
          }

          # ----------------------------------------------------------
          # Download one package
          # ----------------------------------------------------------

          download_package() {
            local package="$1"

            local filename=""
            local repo=""
            local index=""

            # Main repository first.
            if filename="$(find_package "$package" "$MAIN_INDEX")"; then
              repo="$MAIN_REPO"
              index="$MAIN_INDEX"
            else
              # Then X11 repository.
              if filename="$(find_package "$package" "$X11_INDEX")"; then
                repo="$X11_REPO"
                index="$X11_INDEX"
              else
                echo
                echo "ERROR: package not found: $package"
                echo
                echo "Main index:"
                grep \
                  -A15 \
                  -B2 \
                  -m1 \
                  "^Package: ${package}$" \
                  "$MAIN_INDEX" \
                  || true

                echo
                echo "X11 index:"
                grep \
                  -A15 \
                  -B2 \
                  -m1 \
                  "^Package: ${package}$" \
                  "$X11_INDEX" \
                  || true

                exit 1
              fi
            fi

            local url="${repo%/}/${filename}"
            local output="$CACHE/deb/$(basename "$filename")"

            echo
            echo "=========================================="
            echo "Package     : $package"
            echo "Repository  : $repo"
            echo "Filename    : $filename"
            echo "URL         : $url"
            echo "=========================================="

            curl \
              --fail \
              --location \
              --retry 5 \
              --retry-delay 2 \
              "$url" \
              -o "$output"

            test -s "$output"
          }

          # ----------------------------------------------------------
          # Download packages
          # ----------------------------------------------------------

          for package in $PACKAGES; do
            download_package "$package"
          done

          echo
          echo "=========================================="
          echo "Downloaded Termux packages"
          echo "=========================================="

          ls -lh \
            "$CACHE/deb"

      # ------------------------------------------------------------
      # Extract .deb packages
      # ------------------------------------------------------------

      - name: Extract Termux ARM64 packages
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"
          CACHE="$TERMUX_CACHE"

          mkdir -p "$ROOT"

          for deb in "$CACHE"/deb/*.deb; do
            echo
            echo "=========================================="
            echo "Extracting:"
            echo "$(basename "$deb")"
            echo "=========================================="

            TMP="$ROOT/.deb-extract"

            rm -rf "$TMP"
            mkdir -p "$TMP"

            ar x \
              "$deb" \
              --output "$TMP"

            DATA_ARCHIVE=""

            if [ -f "$TMP/data.tar.xz" ]; then
              DATA_ARCHIVE="$TMP/data.tar.xz"

            elif [ -f "$TMP/data.tar.zst" ]; then
              DATA_ARCHIVE="$TMP/data.tar.zst"

            elif [ -f "$TMP/data.tar.gz" ]; then
              DATA_ARCHIVE="$TMP/data.tar.gz"
            fi

            if [ -z "$DATA_ARCHIVE" ]; then
              echo "ERROR: data archive not found"
              ls -la "$TMP"
              exit 1
            fi

            tar \
              -xf "$DATA_ARCHIVE" \
              -C "$ROOT"

            rm -rf "$TMP"
          done

          rm -rf "$ROOT/.deb-extract"

          echo
          echo "=========================================="
          echo "Extracted libraries"
          echo "=========================================="

          find "$ROOT/usr/lib" \
            -maxdepth 1 \
            -type f \
            \( \
              -name '*.so' \
              -o -name '*.a' \
            \) \
            | sort

          echo
          echo "=========================================="
          echo "Extracted pkg-config files"
          echo "=========================================="

          find "$ROOT/usr" \
            -type f \
            -name '*.pc' \
            | sort

          echo
          echo "=========================================="
          echo "Extracted X11 headers"
          echo "=========================================="

          find "$ROOT/usr/include" \
            -maxdepth 3 \
            -type f \
            | sort \
            | grep -E \
              '/(X11|xcb|xorg|xshmfence)/' \
            || true

      # ------------------------------------------------------------
      # Target pkg-config
      # ------------------------------------------------------------

      - name: Configure target pkg-config
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"

          PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"

          {
            echo "PKG_CONFIG_LIBDIR=$PKG_CONFIG_LIBDIR"
            echo "PKG_CONFIG_SYSROOT_DIR=$ROOT"
            echo "PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1"
            echo "PKG_CONFIG_ALLOW_SYSTEM_LIBS=1"
          } >> "$GITHUB_ENV"

          export PKG_CONFIG_LIBDIR
          export PKG_CONFIG_SYSROOT_DIR="$ROOT"
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1

          echo
          echo "PKG_CONFIG_LIBDIR:"
          echo "$PKG_CONFIG_LIBDIR"

      # ------------------------------------------------------------
      # Verify X11/XCB pkg-config
      # ------------------------------------------------------------

      - name: Verify X11 ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"

          export PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$ROOT"
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1

          REQUIRED="
          xcb
          x11
          x11-xcb
          xcb-dri3
          xcb-present
          xcb-xfixes
          xcb-sync
          xcb-randr
          xcb-shm
          xshmfence
          "

          echo
          echo "=========================================="
          echo "Verifying pkg-config"
          echo "=========================================="

          for pc in $REQUIRED; do
            echo
            echo ">>> $pc"

            if ! pkg-config --exists "$pc"; then
              echo "ERROR: missing pkg-config module:"
              echo "$pc"

              echo
              echo "Available modules:"
              pkg-config --list-all \
                | grep -Ei \
                  'xcb|x11|xshmfence' \
                || true

              exit 1
            fi

            echo "Version:"
            pkg-config --modversion "$pc"

            echo "CFLAGS:"
            pkg-config --cflags "$pc"

            echo "LIBS:"
            pkg-config --libs "$pc"
          done

      # ------------------------------------------------------------
      # Force Mesa wrapper
      # ------------------------------------------------------------

      - name: Force enable Vulkan wrapper
        shell: bash
        run: |
          set -euo pipefail

          FILE="src/vulkan/meson.build"

          if grep -qE \
            '^[[:space:]]*with_wrapper_vk[[:space:]]*=[[:space:]]*true' \
            "$FILE"; then

            echo "Vulkan wrapper already enabled."

          else

            echo "Enabling Vulkan wrapper."

            sed -i \
              '1i with_wrapper_vk = true' \
              "$FILE"
          fi

          echo
          echo "=== with_wrapper_vk ==="

          grep -n \
            "with_wrapper_vk" \
            "$FILE"

      # ------------------------------------------------------------
      # Meson cross file
      # ------------------------------------------------------------

      - name: Create Android ARM64 Meson cross file
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p build

          TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"
          SYSROOT="$TOOLCHAIN/sysroot"

          cat > build/android-arm64.ini <<EOF
          [constants]
          ndk = '${NDK_DIR}'
          toolchain = '${TOOLCHAIN}'
          sysroot = '${SYSROOT}'
          termux = '${TERMUX_ROOT}'

          [binaries]
          c = toolchain / 'bin/aarch64-linux-android34-clang'
          cpp = toolchain / 'bin/aarch64-linux-android34-clang++'
          ar = toolchain / 'bin/llvm-ar'
          ranlib = toolchain / 'bin/llvm-ranlib'
          strip = toolchain / 'bin/llvm-strip'
          ld = toolchain / 'bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          sys_root = sysroot
          pkg_config_libdir = [
            termux / 'usr/lib/pkgconfig',
            termux / 'usr/share/pkgconfig'
          ]

          [built-in options]
          c_args = [
            '--sysroot=' + sysroot,
            '-I' + termux / 'usr/include'
          ]

          cpp_args = [
            '--sysroot=' + sysroot,
            '-I' + termux / 'usr/include'
          ]

          c_link_args = [
            '--sysroot=' + sysroot,
            '-L' + termux / 'usr/lib'
          ]

          cpp_link_args = [
            '--sysroot=' + sysroot,
            '-L' + termux / 'usr/lib'
          ]
          EOF

          echo
          echo "=========================================="
          echo "Meson cross file"
          echo "=========================================="

          cat build/android-arm64.ini

      # ------------------------------------------------------------
      # Configure Mesa
      # ------------------------------------------------------------

      - name: Configure Mesa
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$TERMUX_ROOT"

          export PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$ROOT"
          export PKG_CONFIG_ALLOW_SYSTEM_CFLAGS=1
          export PKG_CONFIG_ALLOW_SYSTEM_LIBS=1

          rm -rf \
            build/mesa

          meson setup \
            build/mesa \
            . \
            --cross-file build/android-arm64.ini \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dvulkan-drivers= \
            -Dgallium-drivers=

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------

      - name: Build Mesa
        shell: bash
        run: |
          set -euo pipefail

          meson compile \
            -C build/mesa \
            -j2

      # ------------------------------------------------------------
      # Find wrapper
      # ------------------------------------------------------------

      - name: Find Vulkan wrapper
        shell: bash
        run: |
          set -euo pipefail

          echo
          echo "=========================================="
          echo "Searching for Vulkan wrapper"
          echo "=========================================="

          find build/mesa \
            -type f \
            \( \
              -name 'libvulkan_wrapper.so' \
              -o -name '*vulkan*wrapper*.so' \
            \) \
            -print

      # ------------------------------------------------------------
      # Package and verify ELF
      # ------------------------------------------------------------

      - name: Package Vulkan wrapper
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p \
            artifact/lib

          WRAPPER="$(
            find build/mesa \
              -type f \
              -name 'libvulkan_wrapper.so' \
              | head -n1
          )"

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: libvulkan_wrapper.so not found"
            exit 1
          fi

          echo
          echo "Wrapper:"
          echo "$WRAPPER"

          cp \
            "$WRAPPER" \
            artifact/lib/libvulkan_wrapper.so

          echo
          echo "=========================================="
          echo "file"
          echo "=========================================="

          file \
            artifact/lib/libvulkan_wrapper.so

          echo
          echo "=========================================="
          echo "ELF header"
          echo "=========================================="

          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h \
            artifact/lib/libvulkan_wrapper.so

          echo
          echo "=========================================="
          echo "Architecture"
          echo "=========================================="

          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h \
            artifact/lib/libvulkan_wrapper.so \
            | grep -E \
              'Class:|Machine:|Type:'

          echo
          echo "=========================================="
          echo "NEEDED libraries"
          echo "=========================================="

          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d \
            artifact/lib/libvulkan_wrapper.so \
            | grep NEEDED \
            || true

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifact/
          if-no-files-found: error

و در "src/vulkan/meson.build" هم باید ابتدای فایل این خط وجود داشته باشد:

with_wrapper_vk = true

این نسخه دیگر آن "awk" خراب را ندارد. همچنین repository رسمی Termux نشان می‌دهد "libx11" واقعاً به "libxcb" و "xorgproto" وابسته است، و گزارش‌های build خود Termux نیز زنجیره‌ی "xorgproto → xcb-proto → libxcb → libx11" را نشان می‌دهند.
