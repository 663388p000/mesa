name: Mesa Vulkan Wrapper ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK: ${{ github.workspace }}/android-ndk
      ROOT: ${{ github.workspace }}/termux-root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config python3 python3-mako \
            bison flex gettext cmake curl wget xz-utils zstd unzip binutils

      - name: Download NDK
        run: |
          set -e

          rm -rf "$NDK" "$NDK.tmp" ndk.zip

          curl -4 -fL --retry 5 --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://dl.google.com:443/android/repository/android-ndk-r27d-linux.zip" \
            -o ndk.zip

          mkdir -p "$NDK.tmp"

          unzip -q ndk.zip -d "$NDK.tmp"

          test -d "$NDK.tmp/android-ndk-r27d"

          mv "$NDK.tmp/android-ndk-r27d" "$NDK"

          rm -rf "$NDK.tmp" ndk.zip
      - name: Download X11 libraries
        run: |
          set -e

          ROOT="$ROOT/usr"
          MAIN="https://packages-cf.termux.dev:443/apt/termux-main"

          mkdir -p "$ROOT" /tmp/termux

          wget -4 -q --show-progress \
            "$MAIN/dists/stable/main/binary-aarch64/Packages.gz" \
            -O /tmp/Packages.gz

          gzip -dc /tmp/Packages.gz > /tmp/Packages

          download_pkg() {
            package="$1"

            filename="$(awk -v p="$package" '
              $0 == "Package: " p { found=1; next }
              found && /^Filename: / {
                sub(/^Filename: /, "")
                print
                exit
              }
              found && /^Package: / {
                exit
              }
            ' /tmp/Packages)"

            if [ -z "$filename" ]; then
              echo "ERROR: package not found: $package"
              exit 1
            fi

            echo "Downloading: $package"
            echo "URL: $MAIN/$filename"

            wget -4 -q --show-progress \
              "$MAIN/$filename" \
              -O /tmp/termux/package.deb

            rm -rf /tmp/termux/extract
            mkdir -p /tmp/termux/extract

            ar x /tmp/termux/package.deb \
              --output /tmp/termux/extract

            tar -xf /tmp/termux/extract/data.tar.* \
              -C "$ROOT"
          }

          download_pkg libandroid-support
          download_pkg libxau
          download_pkg libxdmcp
          download_pkg libxcb
          download_pkg libx11
          download_pkg libxext
          download_pkg libxfixes
          download_pkg libxrandr
          download_pkg libxrender
          download_pkg libxshmfence
          download_pkg xorgproto
          download_pkg xcb-proto

          rm -rf /tmp/termux
          rm -f /tmp/Packages.gz
          rm -f /tmp/Packages

      - name: Enable wrapper
        run: |
          set -e

          grep -q "with_wrapper_vk = true" src/vulkan/meson.build || \
            sed -i '1i with_wrapper_vk = true' src/vulkan/meson.build

      - name: Create cross file
        run: |
          set -e

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p build

          printf '%s\n' \
            '[binaries]' \
            "c = '$TOOLCHAIN/bin/aarch64-linux-android34-clang'" \
            "cpp = '$TOOLCHAIN/bin/aarch64-linux-android34-clang++'" \
            "ar = '$TOOLCHAIN/bin/llvm-ar'" \
            "strip = '$TOOLCHAIN/bin/llvm-strip'" \
            "pkg-config = '/usr/bin/pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'android'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'armv8'" \
            "endian = 'little'" \
            '' \
            '[properties]' \
            "sys_root = '$TOOLCHAIN/sysroot'" \
            'pkg_config_libdir = [' \
            "'$ROOT/usr/lib/pkgconfig'," \
            "'$ROOT/usr/share/pkgconfig'" \
            ']' \
            '' \
            '[built-in options]' \
            "c_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']" \
            "cpp_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']" \
            "c_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']" \
            "cpp_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']" \
            > build/android-arm64.ini

      - name: Build Mesa
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/termux-root/usr/lib/pkgconfig:${{ github.workspace }}/termux-root/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/termux-root
        run: |
          set -e

          meson setup build/mesa . \
            --cross-file build/android-arm64.ini \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dvulkan-drivers= \
            -Dgallium-drivers=

          meson compile -C build/mesa -j2

      - name: Package
        run: |
          set -e

          mkdir -p artifact/lib

          WRAPPER="$(find build/mesa -type f -name libvulkan_wrapper.so | head -n1)"

          test -n "$WRAPPER"
          test -f "$WRAPPER"

          cp "$WRAPPER" artifact/lib/libvulkan_wrapper.so

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h artifact/lib/libvulkan_wrapper.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifact
