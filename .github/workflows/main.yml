name: Mesa Vulkan Wrapper ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK: ${{ github.workspace }}/android-ndk
      ROOT: ${{ github.workspace }}/termux-root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build pkg-config python3 python3-mako bison flex gettext cmake curl wget xz-utils zstd unzip binutils

      - name: Download NDK
        run: |
          wget -q --show-progress https://dl.google.com/android/repository/android-ndk-r27d-linux.zip -O ndk.zip
          rm -rf "$NDK" "$NDK.tmp"
          mkdir "$NDK.tmp"
          unzip -q ndk.zip -d "$NDK.tmp"
          mv "$NDK.tmp/android-ndk-r27d" "$NDK"
          rm -rf "$NDK.tmp" ndk.zip

      - name: Download X11 libraries
        run: |
          set -e

          MAIN="https://packages-cf.termux.dev/apt/termux-main"
          X11="https://packages-cf.termux.dev/apt/termux-x11"
          CACHE="$RUNNER_TEMP/termux"
          mkdir -p "$ROOT" "$CACHE"

          curl -fsSL "$MAIN/dists/stable/main/binary-aarch64/Packages.gz" |
            gzip -d > "$CACHE/main"

          curl -fsSL "$X11/dists/x11/main/binary-aarch64/Packages.gz" |
            gzip -d > "$CACHE/x11"

          python3 - "$CACHE" "$ROOT" "$MAIN" "$X11" <<'PY'
          import os
          import sys
          import subprocess
          import urllib.request

          cache, root, main, x11 = sys.argv[1:]

          packages = [
              "libandroid-support",
              "libxau",
              "libxdmcp",
              "libxcb",
              "libx11",
              "libxext",
              "libxfixes",
              "libxrandr",
              "libxrender",
              "libxshmfence",
              "xorgproto",
              "xcb-proto",
          ]

          repos = [
              (main, f"{cache}/main"),
              (x11, f"{cache}/x11"),
          ]

          os.makedirs(f"{cache}/deb", exist_ok=True)

          for package in packages:
              found = False

              for repo, index in repos:
                  data = open(index, errors="ignore").read()

                  for stanza in data.split("\n\n"):
                      fields = {}

                      for line in stanza.splitlines():
                          if ": " in line:
                              key, value = line.split(": ", 1)
                              fields[key] = value.strip()

                      if fields.get("Package") != package:
                          continue

                      if fields.get("Architecture") not in ("aarch64", "all"):
                          continue

                      filename = fields.get("Filename")
                      if not filename:
                          continue

                      url = f"{repo}/{filename}"
                      deb = f"{cache}/deb/{os.path.basename(filename)}"

                      print(f"Downloading {package}")
                      urllib.request.urlretrieve(url, deb)

                      subprocess.run(
                          ["ar", "x", deb, "--output", f"{cache}/extract"],
                          check=True,
                      )

                      break

                  else:
                      continue

                  found = True
                  break

              if not found:
                  raise SystemExit(f"Package not found: {package}")
          PY

          mkdir -p "$CACHE/extract"

          for deb in "$CACHE"/deb/*.deb; do
            rm -rf "$CACHE/extract"
            mkdir -p "$CACHE/extract"
            ar x "$deb" --output "$CACHE/extract"
            tar -xf "$CACHE/extract"/data.tar.* -C "$ROOT"
          done

      - name: Enable wrapper
        run: |
          grep -q "with_wrapper_vk = true" src/vulkan/meson.build ||
            sed -i '1i with_wrapper_vk = true' src/vulkan/meson.build

      - name: Create cross file
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p build

          cat > build/android-arm64.ini <<EOF
          [binaries]
          c = '$TOOLCHAIN/bin/aarch64-linux-android34-clang'
          cpp = '$TOOLCHAIN/bin/aarch64-linux-android34-clang++'
          ar = '$TOOLCHAIN/bin/llvm-ar'
          strip = '$TOOLCHAIN/bin/llvm-strip'
          pkg-config = '/usr/bin/pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'

          [properties]
          sys_root = '$TOOLCHAIN/sysroot'
          pkg_config_libdir = [
            '$ROOT/usr/lib/pkgconfig',
            '$ROOT/usr/share/pkgconfig'
          ]

          [built-in options]
          c_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']
          cpp_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']
          c_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']
          cpp_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']
          EOF

      - name: Build Mesa
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/termux-root/usr/lib/pkgconfig:${{ github.workspace }}/termux-root/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/termux-root
        run: |
          meson setup build/mesa . \
            --cross-file build/android-arm64.ini \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dvulkan-drivers= \
            -Dgallium-drivers=

          meson compile -C build/mesa -j2

      - name: Package
        run: |
          set -e

          mkdir -p artifact/lib

          cp "$(find build/mesa -type f -name libvulkan_wrapper.so | head -n1)" \
            artifact/lib/libvulkan_wrapper.so

          file artifact/lib/libvulkan_wrapper.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifact
