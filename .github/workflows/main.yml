name: Mesa Vulkan Wrapper ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK: ${{ github.workspace }}/android-ndk
      ROOT: ${{ github.workspace }}/termux-root

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            meson ninja-build pkg-config python3 python3-mako \
            bison flex gettext cmake curl wget xz-utils zstd unzip binutils

      - name: Download NDK
        run: |
          set -e
          rm -rf "$NDK" "$NDK.tmp" ndk.zip

          curl -4 -fL --retry 5 --retry-all-errors \
            -A "Mozilla/5.0" \
            "https://dl.google.com:443/android/repository/android-ndk-r27d-linux.zip" \
            -o ndk.zip

          mkdir -p "$NDK.tmp"
          unzip -q ndk.zip -d "$NDK.tmp"
          test -d "$NDK.tmp/android-ndk-r27d"

          mv "$NDK.tmp/android-ndk-r27d" "$NDK"
          rm -rf "$NDK.tmp" ndk.zip

      - name: Download X11 libraries
        run: |
          set -e

          ROOT="$ROOT/usr"
          mkdir -p "$ROOT" /tmp/termux-pkg

          MAIN="https://packages-cf.termux.dev:443/apt/termux-main"
          X11="https://packages-cf.termux.dev:443/apt/termux-x11"

          curl -4 -fL --retry 5 --retry-all-errors \
            -A "Mozilla/5.0" \
            "$MAIN/dists/stable/main/binary-aarch64/Packages.xz" \
            -o /tmp/main-Packages.xz

          curl -4 -fL --retry 5 --retry-all-errors \
            -A "Mozilla/5.0" \
            "$X11/dists/x11/main/binary-aarch64/Packages.xz" \
            -o /tmp/x11-Packages.xz

          xzcat /tmp/main-Packages.xz > /tmp/main-Packages
          xzcat /tmp/x11-Packages.xz > /tmp/x11-Packages

          download_pkg() {
            repo="$1"
            index="$2"
            package="$3"

            filename="$(awk -v p="$package" '
              $0 == "Package: " p { found=1; next }
              found && /^Filename: / {
                sub(/^Filename: /, "")
                print
                exit
              }
              found && /^Package: / { exit }
            ' "$index")"

            test -n "$filename"

            echo "Downloading: $package"
            echo "Path: $filename"

            curl -4 -fL --retry 5 --retry-all-errors \
              -A "Mozilla/5.0" \
              "$repo/$filename" \
              -o /tmp/termux-pkg/package.deb

            rm -rf /tmp/termux-pkg/extract
            mkdir -p /tmp/termux-pkg/extract

            ar x /tmp/termux-pkg/package.deb \
              --output /tmp/termux-pkg/extract

            tar -xf /tmp/termux-pkg/extract/data.tar.* -C "$ROOT"

            rm -rf /tmp/termux-pkg/extract
            rm -f /tmp/termux-pkg/package.deb
          }

          download_pkg "$MAIN" /tmp/main-Packages libandroid-support
          download_pkg "$MAIN" /tmp/main-Packages libxau
          download_pkg "$MAIN" /tmp/main-Packages libxdmcp
          download_pkg "$MAIN" /tmp/main-Packages libxcb
          download_pkg "$MAIN" /tmp/main-Packages libx11
          download_pkg "$MAIN" /tmp/main-Packages libxext
          download_pkg "$MAIN" /tmp/main-Packages libxfixes
          download_pkg "$MAIN" /tmp/main-Packages libxrandr
          download_pkg "$MAIN" /tmp/main-Packages libxrender
          download_pkg "$MAIN" /tmp/main-Packages libxshmfence
          download_pkg "$MAIN" /tmp/main-Packages xorgproto
          download_pkg "$MAIN" /tmp/main-Packages xcb-proto

          rm -f /tmp/main-Packages.xz
          rm -f /tmp/x11-Packages.xz
          rm -f /tmp/main-Packages
          rm -f /tmp/x11-Packages

      - name: Enable wrapper
        run: |
          set -e

          grep -q "with_wrapper_vk = true" src/vulkan/meson.build || \
            sed -i '1i with_wrapper_vk = true' src/vulkan/meson.build

      - name: Create cross file
        run: |
          set -e

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p build

          printf '%s\n' \
            '[binaries]' \
            "c = '$TOOLCHAIN/bin/aarch64-linux-android34-clang'" \
            "cpp = '$TOOLCHAIN/bin/aarch64-linux-android34-clang++'" \
            "ar = '$TOOLCHAIN/bin/llvm-ar'" \
            "strip = '$TOOLCHAIN/bin/llvm-strip'" \
            "pkg-config = '/usr/bin/pkg-config'" \
            '' \
            '[host_machine]' \
            "system = 'android'" \
            "cpu_family = 'aarch64'" \
            "cpu = 'armv8'" \
            "endian = 'little'" \
            '' \
            '[properties]' \
            "sys_root = '$TOOLCHAIN/sysroot'" \
            'pkg_config_libdir = [' \
            "'$ROOT/usr/lib/pkgconfig'," \
            "'$ROOT/usr/share/pkgconfig'" \
            ']' \
            '' \
            '[built-in options]' \
            "c_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']" \
            "cpp_args = ['--sysroot=$TOOLCHAIN/sysroot', '-I$ROOT/usr/include']" \
            "c_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']" \
            "cpp_link_args = ['--sysroot=$TOOLCHAIN/sysroot', '-L$ROOT/usr/lib']" \
            > build/android-arm64.ini

      - name: Build Mesa
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/termux-root/usr/lib/pkgconfig:${{ github.workspace }}/termux-root/usr/share/pkgconfig
          PKG_CONFIG_SYSROOT_DIR: ${{ github.workspace }}/termux-root
        run: |
          set -e

          meson setup build/mesa . \
            --cross-file build/android-arm64.ini \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dvulkan-drivers= \
            -Dgallium-drivers=

          meson compile -C build/mesa -j2

      - name: Package
        run: |
          set -e

          mkdir -p artifact/lib

          WRAPPER="$(find build/mesa -type f -name libvulkan_wrapper.so | head -n1)"
          test -n "$WRAPPER"
          test -f "$WRAPPER"

          cp "$WRAPPER" artifact/lib/libvulkan_wrapper.so

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h artifact/lib/libvulkan_wrapper.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifact
