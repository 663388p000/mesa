name: Build Mesa Vulkan Wrapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK: ${{ github.workspace }}/android-ndk-r27d
      ROOT: ${{ github.workspace }}/termux-root
      NDK_URL: https://dl.google.com/android/repository/android-ndk-r27d-linux.zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            meson \
            ninja-build \
            pkg-config \
            python3-mako \
            wget \
            unzip \
            gzip \
            binutils \
            bison \
            flex

      - name: Download Android NDK
        run: |
          set -e

          rm -rf "$NDK" "$NDK.tmp" ndk.zip

          wget -q --show-progress \
            "$NDK_URL" \
            -O ndk.zip

          mkdir -p "$NDK.tmp"

          unzip -q ndk.zip -d "$NDK.tmp"

          mv "$NDK.tmp/android-ndk-r27d" "$NDK"

          rm -rf "$NDK.tmp" ndk.zip

      - name: Download ARM64 target dependencies
        run: |
          set -e

          rm -rf "$ROOT"
          mkdir -p "$ROOT/usr"

          BASE="https://packages-cf.termux.dev:443/apt/termux-main"

          wget -q \
            "$BASE/dists/stable/main/binary-aarch64/Packages.gz" \
            -O /tmp/Packages.gz

          gzip -dc /tmp/Packages.gz > /tmp/Packages

          download_pkg() {
            PKG="$1"

            FILE=$(awk -v pkg="$PKG" '
              /^Package:/ {
                found = ($2 == pkg)
              }
              found && /^Filename:/ {
                print $2
                exit
              }
            ' /tmp/Packages)

            if [ -z "$FILE" ]; then
              echo "Package not found: $PKG"
              exit 1
            fi

            DEB="/tmp/$(basename "$FILE")"

            echo "Downloading $PKG"

            wget -q --show-progress \
              "$BASE/$FILE" \
              -O "$DEB"

            rm -rf /tmp/pkg
            mkdir -p /tmp/pkg

            cd /tmp/pkg

            ar x "$DEB"

            DATA=$(find . -maxdepth 1 -type f -name 'data.tar.*' | head -n 1)

            if [ -z "$DATA" ]; then
              echo "Invalid package archive: $PKG"
              exit 1
            fi

            mkdir -p extract

            tar -xf "$DATA" -C extract

            if [ -d extract/data/data/com.termux/files/usr ]; then
              cp -a \
                extract/data/data/com.termux/files/usr/. \
                "$ROOT/usr/"
            elif [ -d extract/usr ]; then
              cp -a \
                extract/usr/. \
                "$ROOT/usr/"
            else
              echo "Unknown package layout: $PKG"
              exit 1
            fi

            cd "$GITHUB_WORKSPACE"
          }

          download_pkg libandroid-support
          download_pkg libxau
          download_pkg libxdmcp
          download_pkg libxcb
          download_pkg libx11
          download_pkg libxext
          download_pkg libxfixes
          download_pkg libxrandr
          download_pkg libxrender
          download_pkg libxshmfence
          download_pkg libxxf86vm
          download_pkg libdrm
          download_pkg xorgproto
          download_pkg xcb-proto

          test -f "$ROOT/usr/include/xf86drm.h"
          test -f "$ROOT/usr/include/drm.h"

      - name: Enable Vulkan wrapper
        run: |
          set -e

          if ! grep -q '^with_wrapper_vk = true' src/vulkan/meson.build; then
            sed -i '1i with_wrapper_vk = true' src/vulkan/meson.build
          fi

      - name: Create Android ARM64 cross file
        run: |
          set -e

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"

          mkdir -p build

          cat > build/android-arm64.ini <<EOF
[binaries]
c = '$TOOLCHAIN/bin/aarch64-linux-android34-clang'
cpp = '$TOOLCHAIN/bin/aarch64-linux-android34-clang++'
ar = '$TOOLCHAIN/bin/llvm-ar'
strip = '$TOOLCHAIN/bin/llvm-strip'
pkg-config = '/usr/bin/pkg-config'

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
EOF

      - name: Configure Mesa
        env:
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/termux-root/usr/lib/pkgconfig:${{ github.workspace }}/termux-root/usr/share/pkgconfig
          PKG_CONFIG_PATH: ""
          CFLAGS: >-
            --sysroot=${{ github.workspace }}/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I${{ github.workspace }}/termux-root/usr/include
            -I${{ github.workspace }}/termux-root/usr/include/libdrm
          CXXFLAGS: >-
            --sysroot=${{ github.workspace }}/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -I${{ github.workspace }}/termux-root/usr/include
            -I${{ github.workspace }}/termux-root/usr/include/libdrm
          LDFLAGS: >-
            --sysroot=${{ github.workspace }}/android-ndk-r27d/toolchains/llvm/prebuilt/linux-x86_64/sysroot
            -L${{ github.workspace }}/termux-root/usr/lib
        run: |
          set -e

          rm -rf build/mesa

          meson setup build/mesa . \
            --cross-file build/android-arm64.ini \
            --prefix=/usr \
            --libdir=lib \
            -Dbuildtype=release \
            -Ddefault_library=shared \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Dvulkan-drivers=wrapper \
            -Dgallium-drivers=

      - name: Build Mesa
        run: |
          set -e

          ninja -C build/mesa -j$(nproc)

      - name: Package only Vulkan wrapper
        run: |
          set -e

          rm -rf artifact
          mkdir -p artifact

          WRAPPER=$(find build/mesa \
            -type f \
            -name 'libvulkan_wrapper.so' \
            -print -quit)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: libvulkan_wrapper.so was not produced"
            exit 1
          fi

          echo "Found: $WRAPPER"

          cp -a \
            "$WRAPPER" \
            artifact/libvulkan_wrapper.so

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: libvulkan-wrapper-arm64
          path: artifact/libvulkan_wrapper.so
