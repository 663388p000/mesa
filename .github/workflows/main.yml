name: Build Mesa Vulkan Wrapper - Android ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: r27d
      ANDROID_API: "34"
      NDK_DIR: ${{ github.workspace }}/android-ndk

    steps:
      - name: Checkout Mesa
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            meson \
            ninja-build \
            pkg-config \
            python3 \
            python3-pip \
            python3-mako \
            bison \
            flex \
            gettext \
            cmake \
            curl \
            wget \
            xz-utils \
            unzip \
            ca-certificates

      - name: Download Android NDK
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip \
            -O ndk.zip

          mkdir -p "$NDK_DIR"
          unzip -q ndk.zip -d "$NDK_DIR.tmp"
          mv "$NDK_DIR.tmp/android-ndk-${NDK_VERSION}" "$NDK_DIR"
          rm -rf "$NDK_DIR.tmp" ndk.zip

          echo "NDK=$NDK_DIR"
          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang" \
            --version

      # ------------------------------------------------------------
      # Termux ARM64/Bionic X11 dependencies
      # ------------------------------------------------------------
      #
      # IMPORTANT:
      # Ubuntu x86_64 X11 libraries cannot be linked into the
      # Android ARM64 target. We therefore download ARM64 packages
      # from Termux repositories and use their headers/libs/pkgconfig.
      #
      - name: Download Termux ARM64 repositories
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "$GITHUB_WORKSPACE/termux-root"
          mkdir -p "$GITHUB_WORKSPACE/termux-cache"

          cd "$GITHUB_WORKSPACE/termux-cache"

          # Official Termux repositories
          MAIN_REPO="https://packages-cf.termux.dev/apt/termux-main"
          X11_REPO="https://packages-cf.termux.dev/apt/termux-x11"

          # Download repository metadata.
          #
          # Termux repository metadata has changed format over time,
          # so try compressed formats instead of assuming one filename.
          fetch_index() {
            local repo="$1"
            local dist="$2"
            local out="$3"

            for file in Packages.xz Packages.gz Packages; do
              url="${repo}/dists/${dist}/main/binary-aarch64/${file}"

              echo "Trying: $url"

              if curl -fL --retry 5 --retry-delay 2 \
                   "$url" -o "$out.tmp"; then

                case "$file" in
                  Packages.xz)
                    xz -dc "$out.tmp" > "$out"
                    ;;
                  Packages.gz)
                    gzip -dc "$out.tmp" > "$out"
                    ;;
                  Packages)
                    cp "$out.tmp" "$out"
                    ;;
                esac

                rm -f "$out.tmp"

                if [ -s "$out" ]; then
                  echo "Downloaded $url"
                  return 0
                fi
              fi

              rm -f "$out.tmp"
            done

            echo "ERROR: unable to download package index from $repo"
            return 1
          }

          fetch_index \
            "$MAIN_REPO" \
            stable \
            main-Packages

          fetch_index \
            "$X11_REPO" \
            x11 \
            x11-Packages

          echo "Repository indexes downloaded:"
          wc -l main-Packages x11-Packages

      - name: Download ARM64 X11 dependencies
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/termux-root"
          CACHE="$GITHUB_WORKSPACE/termux-cache"

          mkdir -p "$ROOT"

          MAIN_REPO="https://packages-cf.termux.dev/apt/termux-main"
          X11_REPO="https://packages-cf.termux.dev/apt/termux-x11"

          cd "$CACHE"

          # Packages needed by Mesa Vulkan X11 WSI.
          #
          # Do not use Debian/Ubuntu package names here.
          # These are Termux package names.
          PACKAGES="
          libx11
          libxext
          libxfixes
          libxrandr
          libxrender
          libxcb
          libxshmfence
          xorgproto
          libxau
          libxdmcp
          libandroid-support
          "

          find_package() {
            local pkg="$1"

            awk -v pkg="$pkg" '
              BEGIN {
                RS=""
                FS="\n"
              }
              {
                name=""
                filename=""
                arch=""

                for (i=1; i<=NF; i++) {
                  if ($i ~ /^Package: /)
                    name=substr($i,10)

                  if ($i ~ /^Filename: /)
                    filename=substr($i,11)

                  if ($i ~ /^Architecture: /)
                    arch=substr($i,15)
                }

                if (name == pkg && arch == "aarch64" && filename != "") {
                  print filename
                  exit
                }
              }
            ' main-Packages

            awk -v pkg="$pkg" '
              BEGIN {
                RS=""
                FS="\n"
              }
              {
                name=""
                filename=""
                arch=""

                for (i=1; i<=NF; i++) {
                  if ($i ~ /^Package: /)
                    name=substr($i,10)

                  if ($i ~ /^Filename: /)
                    filename=substr($i,11)

                  if ($i ~ /^Architecture: /)
                    arch=substr($i,15)
                }

                if (name == pkg && arch == "aarch64" && filename != "") {
                  print filename
                  exit
                }
              }
            ' x11-Packages
          }

          download_package() {
            local pkg="$1"
            local filename=""
            local repo=""

            filename=$(awk -v pkg="$pkg" '
              BEGIN { RS=""; FS="\n" }
              {
                name=""
                file=""
                arch=""

                for (i=1; i<=NF; i++) {
                  if ($i ~ /^Package: /)
                    name=substr($i,10)
                  else if ($i ~ /^Filename: /)
                    file=substr($i,11)
                  else if ($i ~ /^Architecture: /)
                    arch=substr($i,15)
                }

                if (name == pkg && arch == "aarch64" && file != "") {
                  print file
                  exit
                }
              }
            ' main-Packages)

            if [ -n "$filename" ]; then
              repo="$MAIN_REPO"
            else
              filename=$(awk -v pkg="$pkg" '
                BEGIN { RS=""; FS="\n" }
                {
                  name=""
                  file=""
                  arch=""

                  for (i=1; i<=NF; i++) {
                    if ($i ~ /^Package: /)
                      name=substr($i,10)
                    else if ($i ~ /^Filename: /)
                      file=substr($i,11)
                    else if ($i ~ /^Architecture: /)
                      arch=substr($i,15)
                  }

                  if (name == pkg && arch == "aarch64" && file != "") {
                    print file
                    exit
                  }
                }
              ' x11-Packages)

              repo="$X11_REPO"
            fi

            if [ -z "$filename" ]; then
              echo "ERROR: package not found: $pkg"
              return 1
            fi

            echo "Package: $pkg"
            echo "Filename: $filename"
            echo "Repository: $repo"

            curl -fL --retry 5 --retry-delay 2 \
              "$repo/$filename" \
              -o "$(basename "$filename")"
          }

          for pkg in $PACKAGES; do
            download_package "$pkg"
          done

          ls -lh *.deb

      - name: Extract Termux packages
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/termux-root"
          CACHE="$GITHUB_WORKSPACE/termux-cache"

          mkdir -p "$ROOT"

          cd "$CACHE"

          for deb in *.deb; do
            echo "Extracting $deb"

            tmp="$ROOT/.tmp"
            rm -rf "$tmp"
            mkdir -p "$tmp"

            ar x "$deb" --output "$tmp"

            data_archive=$(find "$tmp" -maxdepth 1 \
              \( -name 'data.tar.xz' \
              -o -name 'data.tar.zst' \
              -o -name 'data.tar.gz' \) \
              | head -n1)

            if [ -z "$data_archive" ]; then
              echo "ERROR: no data archive in $deb"
              exit 1
            fi

            tar -xf "$data_archive" -C "$ROOT"

            rm -rf "$tmp"
          done

          rm -rf "$ROOT/.tmp"

          echo "Termux sysroot:"
          find "$ROOT" -maxdepth 3 -type d | sort | head -100

      - name: Prepare Android ARM64 pkg-config
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/termux-root"

          mkdir -p "$ROOT/usr/lib/pkgconfig"
          mkdir -p "$ROOT/usr/share/pkgconfig"

          # Termux normally installs .pc files here.
          find "$ROOT" \
            -type f \
            \( -name '*.pc' -o -name '*.la' \) \
            | sort

          echo "PKG_CONFIG_LIBDIR=$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig" \
            >> "$GITHUB_ENV"

          echo "PKG_CONFIG_SYSROOT_DIR=$ROOT" \
            >> "$GITHUB_ENV"

      - name: Verify X11 ARM64 dependencies
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/termux-root"

          export PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$ROOT"

          echo "=== pkg-config ==="

          for pc in \
            xcb \
            x11 \
            x11-xcb \
            xcb-dri3 \
            xcb-present \
            xcb-xfixes \
            xcb-sync \
            xcb-randr \
            xcb-shm \
            xshmfence
          do
            echo
            echo "---- $pc ----"
            pkg-config --modversion "$pc" || true
          done

      - name: Force enable Vulkan wrapper
        shell: bash
        run: |
          set -euo pipefail

          FILE="src/vulkan/meson.build"

          if ! grep -q 'with_wrapper_vk = true' "$FILE"; then
            sed -i '1i with_wrapper_vk = true' "$FILE"
          fi

          grep -n "with_wrapper_vk" "$FILE" | head

      - name: Create Meson cross file
        shell: bash
        run: |
          mkdir -p build

          cat > build/android-arm64.ini <<'EOF'
          [constants]
          ndk = '/home/runner/work/mesa/mesa/android-ndk'
          toolchain = ndk / 'toolchains/llvm/prebuilt/linux-x86_64'
          sysroot = ndk / 'toolchains/llvm/prebuilt/linux-x86_64/sysroot'

          [binaries]
          c = toolchain / 'bin/aarch64-linux-android34-clang'
          cpp = toolchain / 'bin/aarch64-linux-android34-clang++'
          ar = toolchain / 'bin/llvm-ar'
          ranlib = toolchain / 'bin/llvm-ranlib'
          strip = toolchain / 'bin/llvm-strip'
          ld = toolchain / 'bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [built-in options]
          c_args = [
            '--sysroot=' + sysroot,
            '-I/home/runner/work/mesa/mesa/termux-root/usr/include'
          ]

          cpp_args = [
            '--sysroot=' + sysroot,
            '-I/home/runner/work/mesa/mesa/termux-root/usr/include'
          ]

          c_link_args = [
            '--sysroot=' + sysroot,
            '-L/home/runner/work/mesa/mesa/termux-root/usr/lib'
          ]

          cpp_link_args = [
            '--sysroot=' + sysroot,
            '-L/home/runner/work/mesa/mesa/termux-root/usr/lib'
          ]

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Configure Mesa
        shell: bash
        run: |
          set -euo pipefail

          ROOT="$GITHUB_WORKSPACE/termux-root"

          export PKG_CONFIG_LIBDIR="$ROOT/usr/lib/pkgconfig:$ROOT/usr/share/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$ROOT"

          meson setup build \
            --cross-file build/android-arm64.ini \
            -Dplatforms=x11 \
            -Dglx=disabled \
            -Ddefault_library=shared \
            -Dvulkan-drivers= \
            -Dgallium-drivers= \
            -Dbuildtype=release

      - name: Build
        run: |
          meson compile -C build -j2

      - name: Find wrapper
        run: |
          find build -type f \
            \( -name 'libvulkan_wrapper.so' \
            -o -name '*vulkan*wrapper*.so' \) \
            -print

      - name: Package
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p artifact/lib

          WRAPPER=$(find build -type f \
            -name 'libvulkan_wrapper.so' \
            | head -n1)

          if [ -z "$WRAPPER" ]; then
            echo "ERROR: libvulkan_wrapper.so not found"
            exit 1
          fi

          cp "$WRAPPER" artifact/lib/libvulkan_wrapper.so

          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-readelf" \
            -h artifact/lib/libvulkan_wrapper.so \
            || readelf -h artifact/lib/libvulkan_wrapper.so

          file artifact/lib/libvulkan_wrapper.so

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifact/
