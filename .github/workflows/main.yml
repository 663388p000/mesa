name: Build Mesa Vulkan Wrapper

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: r27d
      NDK_DIR: ${{ github.workspace }}/android-ndk-r27d
      ANDROID_API: 34

    steps:
      - name: Checkout Mesa
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-mako \
            meson \
            ninja-build \
            pkg-config \
            bison \
            flex \
            gettext \
            cmake \
            build-essential \
            ccache \
            unzip \
            wget

      - name: Download Android NDK r27d
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            -O android-ndk-r27d-linux.zip

      - name: Verify NDK
        run: |
          echo "22105e410cf29afcf163760cc95522b9fb981121  android-ndk-r27d-linux.zip" \
            | sha1sum -c -

      - name: Extract Android NDK
        run: |
          unzip -q android-ndk-r27d-linux.zip

          test -x "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android34-clang"

          "$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64/bin/clang" \
            --version

      - name: Create Android ARM64 cross file
        run: |
          mkdir -p .ci

          cat > .ci/android-aarch64.ini <<EOF
          [constants]
          ndk_path = '$NDK_DIR'
          toolchain = ndk_path / 'toolchains/llvm/prebuilt/linux-x86_64'

          [binaries]
          ar = toolchain / 'bin/aarch64-linux-android-ar'
          c = [toolchain / 'bin/aarch64-linux-android${ANDROID_API}-clang']
          cpp = [
            toolchain / 'bin/aarch64-linux-android${ANDROID_API}-clang++',
            '-fno-exceptions',
            '-fno-unwind-tables',
            '-fno-asynchronous-unwind-tables',
            '--start-no-unused-arguments',
            '-static-libstdc++',
            '--end-no-unused-arguments'
          ]
          c_ld = 'lld'
          cpp_ld = 'lld'
          strip = toolchain / 'bin/aarch64-linux-android-strip'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

      - name: Setup Mesa
        run: |
          meson setup build \
            --cross-file .ci/android-aarch64.ini \
            --buildtype=release \
            --strip \
            -Dprefix=/data/local/tmp/mesa \
            -Dplatforms=android \
            -Dplatform-sdk-version=${ANDROID_API} \
            -Dandroid-stub=true \
            -Dandroid-libbacktrace=disabled \
            -Ddefault_library=shared \
            -Dvulkan-drivers= \
            -Dgallium-drivers= \
            -Degl=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dtests=false \
            -Dinstall_mesa_clc=false \
            -Dinstall_glx_indirect=false \
            -Dbuild-tests=false

      - name: Build Mesa
        run: |
          ninja -C build -j$(nproc)

      - name: Show Vulkan outputs
        run: |
          echo "=== Shared libraries ==="
          find build -type f \
            \( -name '*.so' -o -name '*.so.*' \) \
            -print

          echo
          echo "=== Vulkan ==="
          find build/src/vulkan -type f \
            -print 2>/dev/null || true

      - name: Collect artifacts
        run: |
          mkdir -p artifacts

          find build -type f \
            \( -name '*.so' -o -name '*.json' \) \
            -exec cp --parents {} artifacts/ \; || true

      - name: Upload Mesa artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mesa-android-arm64
          path: artifacts/
