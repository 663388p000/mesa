name: Build Mesa Vulkan Wrapper - Android ARM64 X11

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    env:
      NDK_VERSION: r27d
      NDK_DIR: ${{ github.workspace }}/android-ndk-r27d
      ANDROID_API: 34
      PREFIX: ${{ github.workspace }}/sysroot

    steps:
      - name: Checkout Mesa
        uses: actions/checkout@v4

      # ------------------------------------------------------------
      # Host tools
      # ------------------------------------------------------------
      - name: Install build dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            python3 \
            python3-pip \
            python3-mako \
            meson \
            ninja-build \
            pkg-config \
            bison \
            flex \
            gettext \
            cmake \
            build-essential \
            ccache \
            unzip \
            wget \
            autoconf \
            automake \
            libtool \
            xorgproto \
            xtrans \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcb1-dev \
            libxcb-randr0-dev \
            libxcb-sync-dev \
            libxcb-xfixes0-dev \
            libxcb-present-dev

      # ------------------------------------------------------------
      # Android NDK r27d
      # ------------------------------------------------------------
      - name: Download Android NDK r27d
        run: |
          wget -q \
            https://dl.google.com/android/repository/android-ndk-r27d-linux.zip \
            -O android-ndk-r27d-linux.zip

      - name: Verify Android NDK
        run: |
          echo \
            "22105e410cf29afcf163760cc95522b9fb981121  android-ndk-r27d-linux.zip" \
            | sha1sum -c -

      - name: Extract Android NDK
        run: |
          unzip -q android-ndk-r27d-linux.zip

          test -d "$NDK_DIR"

          echo "NDK:"
          "$NDK_DIR/ndk-build" --version || true

      # ------------------------------------------------------------
      # Android compiler
      # ------------------------------------------------------------
      - name: Verify Android ARM64 compiler
        run: |
          export TOOLCHAIN="$NDK_DIR/toolchains/llvm/prebuilt/linux-x86_64"

          test -x \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang"

          test -x \
            "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++"

          test -x "$TOOLCHAIN/bin/llvm-ar"
          test -x "$TOOLCHAIN/bin/llvm-ranlib"
          test -x "$TOOLCHAIN/bin/llvm-strip"
          test -x "$TOOLCHAIN/bin/ld.lld"

          "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang" \
            --version

          "$TOOLCHAIN/bin/aarch64-linux-android${ANDROID_API}-clang++" \
            --version

      # ------------------------------------------------------------
      # Target sysroot
      #
      # IMPORTANT:
      # Android NDK does not contain X11.
      #
      # This sysroot is reserved for ARM64 X11/XCB dependencies.
      # ------------------------------------------------------------
      - name: Prepare ARM64 target sysroot
        run: |
          mkdir -p "$PREFIX"

          mkdir -p \
            "$PREFIX/include" \
            "$PREFIX/lib" \
            "$PREFIX/share"

          echo "Target prefix:"
          echo "$PREFIX"

      # ------------------------------------------------------------
      # Inspect wrapper configuration
      # ------------------------------------------------------------
      - name: Inspect Vulkan wrapper
        run: |
          echo "=== Wrapper files ==="
          find src/vulkan/wrapper -maxdepth 2 -type f -print

          echo
          echo "=== with_wrapper_vk ==="
          grep -Rni \
            "with_wrapper_vk" \
            src/vulkan \
            meson.build \
            meson_options.txt \
            meson.options \
            2>/dev/null || true

          echo
          echo "=== XCB/Xlib ==="
          grep -RniE \
            "DVK_USE_PLATFORM_(XCB|XLIB)_KHR|VK_USE_PLATFORM_(XCB|XLIB)_KHR" \
            src/vulkan \
            2>/dev/null || true

      # ------------------------------------------------------------
      # Meson cross file
      #
      # Target is Android ARM64.
      # X11/XCB are explicitly requested through compiler defines.
      # ------------------------------------------------------------
      - name: Create Android ARM64 X11 cross file
        run: |
          mkdir -p .ci

          cat > .ci/android-aarch64-x11.ini <<EOF
          [constants]
          ndk = '${NDK_DIR}'
          toolchain = ndk / 'toolchains/llvm/prebuilt/linux-x86_64'
          target_prefix = '${PREFIX}'

          [binaries]
          c = toolchain / 'bin/aarch64-linux-android${ANDROID_API}-clang'
          cpp = toolchain / 'bin/aarch64-linux-android${ANDROID_API}-clang++'
          ar = toolchain / 'bin/llvm-ar'
          ranlib = toolchain / 'bin/llvm-ranlib'
          strip = toolchain / 'bin/llvm-strip'
          ld = toolchain / 'bin/ld.lld'
          pkg-config = '/usr/bin/pkg-config'

          [built-in options]
          c_args = [
            '-DVK_USE_PLATFORM_XCB_KHR',
            '-DVK_USE_PLATFORM_XLIB_KHR',
            '-DDVK_USE_PLATFORM_XCB_KHR',
            '-DDVK_USE_PLATFORM_XLIB_KHR',
            '-I${PREFIX}/include'
          ]

          cpp_args = [
            '-DVK_USE_PLATFORM_XCB_KHR',
            '-DVK_USE_PLATFORM_XLIB_KHR',
            '-DDVK_USE_PLATFORM_XCB_KHR',
            '-DDVK_USE_PLATFORM_XLIB_KHR',
            '-I${PREFIX}/include'
          ]

          c_link_args = [
            '-L${PREFIX}/lib'
          ]

          cpp_link_args = [
            '-L${PREFIX}/lib'
          ]

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8'
          endian = 'little'
          EOF

          cat .ci/android-aarch64-x11.ini

      # ------------------------------------------------------------
      # Configure Mesa
      #
      # NO:
      #   -Dplatforms=android
      #
      # We want the Linux/X11 code path compiled with Android clang.
      # ------------------------------------------------------------
      - name: Configure Mesa
        run: |
          rm -rf build

          meson setup build \
            --cross-file .ci/android-aarch64-x11.ini \
            --buildtype=release \
            --strip \
            -Dprefix=/usr \
            -Ddefault_library=shared \
            -Dvulkan-drivers= \
            -Dgallium-drivers= \
            -Degl=disabled \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Dtests=false \
            -Dbuild-tests=false \
            -Dinstall_mesa_clc=false \
            -Dinstall_glx_indirect=false

      # ------------------------------------------------------------
      # Build
      # ------------------------------------------------------------
      - name: Build Mesa
        run: |
          ninja -C build -j"$(nproc)"

      # ------------------------------------------------------------
      # Inspect binaries
      # ------------------------------------------------------------
      - name: Inspect generated libraries
        run: |
          echo "=== Shared libraries ==="

          find build \
            -type f \
            \( -name '*.so' -o -name '*.so.*' \) \
            -print

          echo
          echo "=== Vulkan wrapper ==="

          find build \
            -type f \
            \( \
              -name 'libvulkan_wrapper.so' \
              -o -name '*vulkan*wrapper*.so' \
              -o -name '*wrapper*.json' \
              -o -name '*vulkan*.json' \
            \) \
            -print

      # ------------------------------------------------------------
      # Verify architecture
      # ------------------------------------------------------------
      - name: Verify ARM64 output
        run: |
          echo "=== ELF architecture ==="

          find build \
            -type f \
            -name '*.so*' \
            -print0 |
          while IFS= read -r -d '' f; do
            echo
            echo ">>> $f"
            file "$f"
          done

      # ------------------------------------------------------------
      # Collect
      # ------------------------------------------------------------
      - name: Collect artifacts
        run: |
          rm -rf artifacts
          mkdir -p artifacts

          find build \
            -type f \
            \( \
              -name 'libvulkan_wrapper.so' \
              -o -name '*.so' \
              -o -name '*.so.*' \
              -o -name '*.json' \
            \) \
            -exec cp --parents {} artifacts/ \; || true

          echo
          echo "=== Artifacts ==="
          find artifacts -type f -print

      # ------------------------------------------------------------
      # Upload
      # ------------------------------------------------------------
      - name: Upload Mesa Android ARM64 X11 Wrapper
        uses: actions/upload-artifact@v4
        with:
          name: mesa-vulkan-wrapper-android-arm64-x11
          path: artifacts/
          if-no-files-found: error
